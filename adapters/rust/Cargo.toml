[package]
name = "ftnl-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "File Tunnel upload-job adapter for opto-sync"
repository = "https://github.com/file-tunnel/ftnl-sync"

[features]
default = []
opto = ["dep:opto-sync-client"]

[dependencies]
opto-sync-client = { path = "../../opto-sync-clients/clients/rust", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
