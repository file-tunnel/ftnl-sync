name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          # No persisted token should be readable by PR-controlled audit code.
          # Bind secret auditing to the reviewed PR head (or pushed SHA), not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Public source checkout only; do not supply cross-org secrets or age keys.
      - name: Verify audited source commit matches immutable event SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Check out pinned public ores-sops contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-sops
          ref: f0f5325b4212541943627d3d1123f0e70824302a
          path: .ci/ores-sops
          persist-credentials: false
      - name: Verify exact ores-sops commit and expose executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/ores-sops rev-parse HEAD)" = "f0f5325b4212541943627d3d1123f0e70824302a"
          test -x .ci/ores-sops/ores-sops
          echo "${GITHUB_WORKSPACE}/.ci/ores-sops" >> "${GITHUB_PATH}"

      - name: Check out pinned public flags-2-env CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flags-2-env/flags-2-env
          ref: 7da1ea0a67b43ee3e523e28b5bc4757cc886d3b9
          path: .ci/flags-2-env
          persist-credentials: false
      - name: Verify flags2env revision and install binary on PATH
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/flags-2-env rev-parse HEAD)" = "7da1ea0a67b43ee3e523e28b5bc4757cc886d3b9"
          # Do not trust a checked-in, possibly stale native executable; rebuild the
          # exact pinned public C sources with the runner's native compiler.
          make -B -C .ci/flags-2-env build/flags2env
          test -x .ci/flags-2-env/build/flags2env
          (cd .ci/ores-sops && "${GITHUB_WORKSPACE}/.ci/flags-2-env/build/flags2env" audit .cli-flags.toml >/dev/null)
          echo "${GITHUB_WORKSPACE}/.ci/flags-2-env/build" >> "${GITHUB_PATH}"

      - name: Install SHA256-verified just release
        env:
          JUST_VERSION: 1.51.0
          # Exact digest of the x86_64 musl asset published in the v1.51.0
          # GitHub Release API. A version-only URL is not an integrity pin.
          JUST_TARBALL_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 --output "$tmp/just.tar.gz" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$JUST_TARBALL_SHA256" "$tmp/just.tar.gz" | sha256sum --check --status
          tar -xzf "$tmp/just.tar.gz" -C "$tmp" just
          test -f "$tmp/just"
          sudo install -m 0755 "$tmp/just" /usr/local/bin/just
          test "$(just --version)" = "just ${JUST_VERSION}"

      - name: just env-check
        run: just env-check
