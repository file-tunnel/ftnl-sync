name: Formal methods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-methods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opto-sync-model:
    name: Inherited opto-sync Quint and TLC verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NO_COLOR: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Validate, simulate, and exhaustively verify inherited model
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .formal-artifacts
          nix develop --command bash scripts/formal-check.sh all 2>&1 \
            | tee .formal-artifacts/opto-sync-formal.log
      - name: Upload model-checker output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftnl-sync-formal-model
          path: |
            .formal-artifacts/
            opto-sync-clients/formal/fm.toml
            opto-sync-clients/formal/opto_sync_protocol.qnt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  rust-properties:
    name: Rust persisted-upload properties
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - working-directory: adapters/rust
        run: >-
          nix develop ../.. --command cargo test --locked
          progress_validation_matches_the_declared_bound

  kani:
    name: Kani persisted-progress proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: adapters/rust
      - name: Install pinned Kani verifier
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Prove persisted progress bounds
        working-directory: adapters/rust
        run: cargo kani

  opto-c-core:
    name: Pinned opto-sync C core CBMC proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Prove production timestamp ordering and malformed FFI rejection
        working-directory: opto-sync-clients/syncer.c
        run: nix develop --command bash scripts/formal-check.sh c

  opto-rust:
    name: Pinned opto-sync Rust Kani proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install pinned Kani verifier
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Prove opto-sync queue arithmetic
        working-directory: opto-sync-clients/clients/rust
        run: cargo kani --no-default-features
      - name: Prove opto-sync Rust/C FFI boundary
        working-directory: opto-sync-clients/syncer.c/bindings/rust
        run: cargo kani
